[project]
name = "kindaframe"
version = "0.1.0"
description = "kinda-frame renderer: serves 16-grey PNG frames for a Kindle sleep screen"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pillow>=11",
    "numpy>=2.1",
    "jinja2>=3.1",
    "httpx>=0.28",
    "icalendar>=6",
    "recurring-ical-events>=3",
    "tzdata>=2026.6",
    "playwright>=1.48",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kindaframe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
