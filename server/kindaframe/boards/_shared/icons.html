{#- Weather icons as inline line-art SVG (black strokes only: crisp on 16 greys, no network). -#}
{% macro cloud(y=0) -%}
<path d="M17 {{ 44 + y }} h30 a10 10 0 0 0 0-20 a14 14 0 0 0-27-4 a10 10 0 0 0-3 24z" />
{%- endmacro %}

{% macro icon(name, cls="icon") -%}
<svg class="{{ cls }}" viewBox="0 0 64 64" fill="none" stroke="#000" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == "clear" %}
  <circle cx="32" cy="32" r="11" />
  {% for a in range(8) %}<line x1="32" y1="9" x2="32" y2="15" transform="rotate({{ a * 45 }} 32 32)" />{% endfor %}
{%- elif name == "partly" %}
  <circle cx="24" cy="22" r="8" />
  {% for a in range(5) %}<line x1="24" y1="6" x2="24" y2="10" transform="rotate({{ -90 + a * 45 }} 24 22)" />{% endfor %}
  <path fill="#fff" d="M21 50 h28 a9 9 0 0 0 0-18 a13 13 0 0 0-25-3 a9 9 0 0 0-3 21z" />
{%- elif name == "fog" %}
  {{ cloud(-6) }}<line x1="12" y1="48" x2="52" y2="48" /><line x1="16" y1="55" x2="48" y2="55" />
{%- elif name == "drizzle" %}
  {{ cloud(-8) }}{% for x in (24, 34, 44) %}<line x1="{{ x }}" y1="45" x2="{{ x - 1 }}" y2="49" />{% endfor %}
{%- elif name == "rain" %}
  {{ cloud(-8) }}{% for x in (24, 34, 44) %}<line x1="{{ x }}" y1="44" x2="{{ x - 4 }}" y2="56" />{% endfor %}
{%- elif name == "snow" %}
  {{ cloud(-8) }}{% for x in (24, 34, 44) %}<circle cx="{{ x }}" cy="{{ 49 + (x % 3) * 2 }}" r="1.6" fill="#000" />{% endfor %}
{%- elif name == "storm" %}
  {{ cloud(-8) }}<path d="M33 40 l-6 11 h8 l-5 10" />
{%- else %}
  {{ cloud(0) }}
{%- endif %}
</svg>
{%- endmacro %}
